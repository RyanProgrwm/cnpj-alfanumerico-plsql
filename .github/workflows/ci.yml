name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: oracle
          APP_USER: app
          APP_USER_PASSWORD: app
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    env:
      UTPLSQL_VERSION: v.3.2.3
      APP: app/app@//localhost/FREEPDB1

    steps:
      - uses: actions/checkout@v7

      # o contexto "job" só pode ser lido dentro dos passos, não no env do job
      - name: copia o projeto para o contêiner do oracle
        run: |
          echo "DB=${{ job.services.oracle.id }}" >> "$GITHUB_ENV"
          docker cp . "${{ job.services.oracle.id }}":/tmp/projeto

      - name: instala o utplsql
        run: |
          curl -sSL -o utPLSQL.zip "https://github.com/utPLSQL/utPLSQL/releases/download/$UTPLSQL_VERSION/utPLSQL.zip"
          unzip -q utPLSQL.zip -d ut
          src=$(dirname "$(find ut -path '*source/install_headless.sql' | head -1)")
          docker cp "$src" "$DB":/tmp/utplsql
          # o instalador grava arquivos temporários na própria pasta; o docker cp deixa o dono errado
          docker exec -u root "$DB" chmod -R a+rwX /tmp/utplsql /tmp/projeto
          docker exec -w /tmp/utplsql "$DB" sqlplus -s -l "sys/oracle@//localhost/FREEPDB1 as sysdba" @install_headless.sql < /dev/null > install.log 2>&1 || true
          tail -5 install.log
          if versao=$(bash ci/sql.sh "$APP" @ci/versao_ut.sql | grep -o 'UTPLSQL=.*'); then
            echo "::notice::${versao#UTPLSQL=} instalado"
          else
            echo "::error title=utPLSQL não instalou::$(grep -v '^[[:space:]]*$' install.log | grep -v 'created\.' | tail -30 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi

      - name: compila o pacote e os testes
        run: bash ci/sql.sh "$APP" @ci/compila.sql

      - name: roda os testes
        run: |
          bash ci/sql.sh "$APP" @ci/testes.sql | tee resultado.txt
          resumo=$(grep -E '^[0-9]+ tests?, ' resultado.txt | tail -1)
          echo "::notice::$resumo"
          if ! grep -Eq '^[0-9]+ tests?, 0 failed, 0 errored' resultado.txt; then
            echo "::error title=testes falharam::$(grep -v '^[[:space:]]*$' resultado.txt | tail -40 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi

      - name: roda os exemplos
        run: bash ci/sql.sh "$APP" @scripts/exemplos.sql

      - name: confere os scripts de diagnóstico num legado de exemplo
        run: |
          bash ci/sql.sh "$APP" @ci/legado.sql
          bash ci/sql.sh "$APP" @scripts/colunas_cnpj.sql | tee colunas.txt
          bash ci/sql.sh "$APP" @scripts/codigo_cnpj_numerico.sql | tee codigo.txt
          falha() { echo "::error title=diagnóstico::$1%0A$(sed ':a;N;$!ba;s/\n/%0A/g' colunas.txt codigo.txt)"; exit 1; }
          grep -q 'CLIENTE_LEGADO.*CNPJ '      colunas.txt || falha "coluna numérica não encontrada"
          grep -q 'CLIENTE_LEGADO.*CGC_ANTIGO' colunas.txt || falha "coluna curta não encontrada"
          ! grep -q 'CNPJ_NOVO'                colunas.txt || falha "coluna correta apareceu como problema"
          grep -q 'GRAVA_CLIENTE_LEGADO'       codigo.txt  || falha "to_number em cnpj não encontrado"
          echo "::notice title=diagnóstico encontrou os 3 problemas do legado de exemplo::$(grep -v '^[[:space:]]*$' colunas.txt codigo.txt | sed ':a;N;$!ba;s/\n/%0A/g')"
